name: Install Linux build dependencies
description: >
  Installs the GTK/WebKit system libraries Tauri links against on Linux.
  Kept in one place so the CI and release workflows cannot drift apart.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          curl \
          file \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libssl-dev \
          libwebkit2gtk-4.1-dev \
          libxdo-dev \
          patchelf \
          wget
