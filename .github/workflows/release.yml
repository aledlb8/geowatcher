name: Release

# Publishing is driven by a version tag, e.g. `git tag v0.1.0 && git push --tags`.
# The workflow can also be started by hand to produce an unpublished draft.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Bundle ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (universal)
            os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - label: Linux (x86_64)
            os: ubuntu-22.04
            args: ""
            targets: x86_64-unknown-linux-gnu
          - label: Windows (x86_64)
            os: windows-latest
            args: ""
            targets: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.os }}

      - run: npm ci

      # tauri-action runs `beforeBuildCommand` itself, bundles for the host,
      # then uploads each artifact to a single draft release shared by the matrix.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-dev', github.run_number) }}
          releaseName: GeoWatcher ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          releaseBody: |
            Download the build for your platform below.

            | Platform | File |
            | --- | --- |
            | Windows | `.msi` or `.exe` |
            | macOS | `.dmg` |
            | Linux | `.AppImage` or `.deb` |
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
