name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint, format & typecheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: ./.github/actions/linux-deps

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Biome (lint + format)
        run: npm run check

      - name: TypeScript
        run: npm run typecheck

      - name: rustfmt
        run: npm run rust:fmt:check

      - name: Clippy
        run: npm run rust:clippy
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'

  build:
    name: Build ${{ matrix.label }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - label: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Fetch ffmpeg sidecar
        run: node scripts/fetch-ffmpeg.mjs --target ${{ matrix.target }}

      - name: Build bundle
        run: npm run build -- --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: geowatcher-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error
          retention-days: 7
