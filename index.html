<!doctype html>
<html lang="en" data-surface="app">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <title>GeoWatcher</title>

    <script>
      // Runs before first paint so the widget window never flashes opaque.
      // Must match the label in src-tauri/src/widget.rs.
      document.documentElement.dataset.surface =
        window.__TAURI_INTERNALS__?.metadata?.currentWindow?.label === "widget" ? "widget" : "app";
    </script>

    <style>
      html {
        background: #11111b;
      }
      html[data-surface="widget"] {
        background: transparent;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
