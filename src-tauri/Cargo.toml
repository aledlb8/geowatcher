[package]
name = "geowatcher"
version = "0.1.0"
description = "Watches Geometry Dash streams on Twitch and alerts you when someone gets far on a real attempt."
authors = ["Alejandro de la Blanca"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/aledlb8/geowatcher"
edition = "2021"
rust-version = "1.82"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "geowatcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-notification = "2.3.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "process", "rt-multi-thread", "sync", "time", "io-util"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "charset", "http2", "rustls"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The Tauri command macro generates functions that take owned values by design.
needless_pass_by_value = "allow"
# Library-oriented doc lints; this is an application.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# Release bundles favour size and speed over build time.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
